name: Supabase ébren tartás

# A Supabase ingyenes csomagján 7 nap tétlenség után leáll a projekt.
# Ez a munkafolyamat 3 naponta lefuttat egy apró lekérdezést, így sosem alszik el.
# Beállítás: Repo → Settings → Secrets and variables → Actions → New repository secret
#   SUPABASE_URL       (pl. https://xxxx.supabase.co)
#   SUPABASE_ANON_KEY  (anon / publishable kulcs)

on:
  schedule:
    - cron: '23 5 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Adatbázis megpiszkálása
        run: |
          code=$(curl -sS -X POST -o /dev/null -w '%{http_code}' \
            "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/ping" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" -d '{}')
          echo "HTTP $code"
          test "$code" = "200"
